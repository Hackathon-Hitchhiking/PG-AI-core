[tool.poetry]
name = "pg-ai-core"
version = "0.1.0"
description = "AI-core for agents to many of projects"
authors = ["Leonid Chesnikov <leonid.chesnikov@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
transformers = {git = "https://github.com/huggingface/transformers.git"}
diffusers = "^0.32.2"
pydantic = "^2.10.6"
langchain = "^0.3.20"
llama-cpp-python = "^0.3.8"
vllm = "^0.7.3"
llama-index-core = "^0.12.23.post2"
langchain-core = "^0.3.44"
langchain-openai = "^0.3.8"
langchain-huggingface = "^0.1.2"
llama-index = "^0.12.23"
ipykernel = "^6.29.5"
ipywidgets = "^8.1.5"
accelerate = "^1.5.2"
yandex-cloud-ml-sdk = "^0.4.1"
cachetools = "^5.5.2"
openai = "^1.66.3"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
